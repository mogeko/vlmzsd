name: Build & Test

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: homebrew/actions/setup-homebrew@main
      - name: Fetch minimum Zig version
        id: zig-version
        run: |
          ZIG_VER="$(sed -n 's/.*minimum_zig_version = "\([0-9]*\.[0-9]*\)\.[0-9]*".*/\1/p' build.zig.zon)"
          echo "Minimum Zig version: $ZIG_VER"
          echo "version=$ZIG_VER" >> "$GITHUB_OUTPUT"
      - name: Fetch Zig bottle SHA
        id: zig-sha
        run: |
          ZIG_INFO="$(brew info --json=v2 "zig@${{ steps.zig-version.outputs.version }}")"
          ZIG_SHA="$(echo "$ZIG_INFO" | jq -r '.formulae[0].bottle.stable.files | to_entries[0].value.sha256')"
          if [ -z "$ZIG_SHA" ] || [ "$ZIG_SHA" = "null" ]; then
            echo "::error::Failed to determine Zig bottle SHA"
            exit 1
          fi
          echo "Zig bottle SHA: $ZIG_SHA"
          echo "sha=$ZIG_SHA" >> "$GITHUB_OUTPUT"
      - name: Cache Homebrew (Linuxbrew)
        id: homebrew-cache
        uses: actions/cache@v6
        with:
          path: /home/linuxbrew/.linuxbrew
          key: ${{ runner.os }}-${{ runner.arch }}-homebrew-zig-${{ steps.zig-sha.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-homebrew-zig-
      - name: Set up Zig
        if: steps.homebrew-cache.outputs.cache-hit != 'true'
        run: |
          ZIG_FULL="zig@${{ steps.zig-version.outputs.version }}"
          if brew list --versions "$ZIG_FULL" >/dev/null 2>&1; then
            brew reinstall --yes "$ZIG_FULL"
          else
            brew install --yes "$ZIG_FULL"
          fi
      - run: zig build vlmzsd vlmzs kmdconv --summary all
      - run: zig build test --summary all
      - run: ./zig-out/bin/vlmzsd --version
      - run: ./zig-out/bin/vlmzs --version
