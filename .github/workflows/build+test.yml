name: Build & Test

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: mogeko/setup-zig@v1
      - run: zig build vlmzsd vlmzs kmdconv --summary all
      - run: zig build test --summary all
      - run: |
          for bin in ./zig-out/bin/vlmzsd ./zig-out/bin/vlmzs; do
            "$bin" --version
            if "$bin" --version | grep -q unknown; then
              echo "::error::$bin reports 'unknown': the git hash was not embedded"
              exit 1
            fi
          done
